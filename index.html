<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全屏时钟 · 极简版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Helvetica Neue', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(145deg, #0a1422 0%, #101c2c 100%);
            color: #ffb347;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(255,180,70,0.08) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
        }
        #clock {
            background: rgba(10, 20, 34, 0.55);
            backdrop-filter: blur(2px);
            border-radius: 72px;
            padding: 40px 60px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.08);
            border: 1px solid rgba(255,200,100,0.2);
            min-width: 320px;
        }
        #date-part {
            font-size: 3.6em;
            font-weight: 500;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-shadow: 0 0 8px rgba(255, 140, 0, 0.7);
            color: #ffbc6e;
            background: rgba(0,0,0,0.25);
            padding: 0 20px;
            border-radius: 60px;
            display: inline-block;
        }
        #week-part {
            font-size: 2.8em;
            font-weight: 500;
            margin-bottom: 40px;
            opacity: 0.9;
            background: rgba(0,0,0,0.25);
            padding: 8px 24px;
            border-radius: 60px;
            display: inline-block;
            letter-spacing: 4px;
        }
        #time-part {
            font-size: 12em;
            font-weight: 800;
            font-family: 'Helvetica Neue', 'SF Mono', 'JetBrains Mono', monospace;
            letter-spacing: 12px;
            text-shadow: 0 0 25px rgba(255, 160, 50, 0.9);
            color: #ffbd4a;
            margin-top: 20px;
            line-height: 1.2;
        }
        /* 响应式：手机屏幕时间更大但适配 */
        @media (max-width: 768px) {
            #clock {
                padding: 30px 40px;
                border-radius: 56px;
            }
            #date-part {
                font-size: 2.4em;
                margin-bottom: 12px;
            }
            #week-part {
                font-size: 1.8em;
                margin-bottom: 24px;
                padding: 4px 18px;
            }
            #time-part {
                font-size: 7.5em;
                letter-spacing: 6px;
            }
        }
        @media (max-width: 550px) {
            #clock {
                padding: 24px 28px;
                border-radius: 48px;
            }
            #date-part {
                font-size: 1.8em;
                padding: 0 12px;
            }
            #week-part {
                font-size: 1.4em;
                margin-bottom: 20px;
            }
            #time-part {
                font-size: 5.2em;
                letter-spacing: 4px;
            }
        }
        @media (max-width: 400px) {
            #time-part {
                font-size: 4em;
                letter-spacing: 3px;
            }
            #date-part {
                font-size: 1.5em;
            }
            #week-part {
                font-size: 1.2em;
            }
        }
        @keyframes subtleGlow {
            0% { text-shadow: 0 0 12px rgba(255,150,30,0.5);}
            100% { text-shadow: 0 0 28px rgba(255,180,60,0.95);}
        }
        #time-part {
            animation: subtleGlow 1.8s infinite alternate;
        }
        /* 简洁装饰下划线 */
        .divider {
            width: 80px;
            height: 2px;
            background: rgba(255,180,70,0.3);
            margin: 16px auto 0;
            border-radius: 2px;
        }
    </style>
</head>
<body>
<div id="clock">
    <div id="date-part">----/--/--</div>
    <div id="week-part">星期</div>
    <div id="time-part">00:00:00</div>
    <div class="divider"></div>
</div>

<script>
    (function(){
        var dateEl = document.getElementById('date-part');
        var weekEl = document.getElementById('week-part');
        var timeEl = document.getElementById('time-part');

        function pad(n) {
            return n < 10 ? '0' + n : n;
        }

        function update() {
            var now = new Date();
            var y = now.getFullYear();
            var m = pad(now.getMonth() + 1);
            var d = pad(now.getDate());
            var h = pad(now.getHours());
            var i = pad(now.getMinutes());
            var s = pad(now.getSeconds());

            var weekdays = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
            var week = weekdays[now.getDay()];

            dateEl.innerText = y + '-' + m + '-' + d;
            weekEl.innerText = week;
            timeEl.innerText = h + ':' + i + ':' + s;

            requestAnimationFrame(function() {
                setTimeout(update, 1000 - (now.getMilliseconds()));
            });
        }

        update();
    })();
</script>
</body>
</html>
