<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全屏时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0f1c2e;
            color: #ff9500;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        /* 日期 + 星期 同一行 */
        #top {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 40px;
        }
        #date {
            font-size: 5em;
            text-shadow: 0 0 10px rgba(255,255,255,0.6);
        }
        #week {
            font-size: 4.5em;
            opacity: 0.9;
        }
        /* 时间（超大字体） */
        #time {
            font-size: 15em;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255, 149, 0, 0.9);
        }
    </style>
</head>
<body>
    <div id="top">
        <div id="date">0000-00-00</div>
        <div id="week">星期几</div>
    </div>
    <div id="time">00:00:00</div>

    <script>
        var dateEl = document.getElementById('date');
        var weekEl = document.getElementById('week');
        var timeEl = document.getElementById('time');

        function pad(n) {
            return n < 10 ? '0' + n : n;
        }

        function updateClock() {
            var now = new Date();
            var year = now.getFullYear();
            var month = pad(now.getMonth() + 1);
            var day = pad(now.getDate());
            var hour = pad(now.getHours());
            var minute = pad(now.getMinutes());
            var second = pad(now.getSeconds());
            
            var week = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][now.getDay()];

            dateEl.innerText = year + "-" + month + "-" + day;
            weekEl.innerText = week;
            timeEl.innerText = hour + ":" + minute + ":" + second;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
