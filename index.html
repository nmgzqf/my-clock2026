<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>全屏时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0f1c2e;
            color: #ff9500;
            /* 修复：标准垂直水平居中，解决iPad偏上 */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }
        #clock {
            -webkit-user-select: none;
            user-select: none;
        }
        /* 缩小日期字号，防止星期换行 */
        #date-part {
            font-size: 5.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 6px rgba(255,255,255,0.7);
            white-space: nowrap; /* 强制不换行 */
        }
        #time-part {
            font-size: 13em;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255,255,255,0.9);
        }
    </style>
</head>
<body>
    <div id="clock">
        <div id="date-part">0000-00-00</div>
        <div id="time-part">00:00:00</div>
    </div>

    <script>
        var dateEl = document.getElementById('date-part');
        var timeEl = document.getElementById('time-part');
        
        function pad(n) { return n < 10 ? '0' + n : n; }
        
        function update() {
            var now = new Date();
            var y = now.getFullYear();
            var m = pad(now.getMonth()+1);
            var d = pad(now.getDate());
            var h = pad(now.getHours());
            var i = pad(now.getMinutes());
            var s = pad(now.getSeconds());

            var week = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][now.getDay()];
            
            dateEl.innerText = y + '-' + m + '-' + d + "  " + week;
            timeEl.innerText = h + ':' + i + ':' + s;
            
            setTimeout(update, 1000);
        }
        update();
    </script>
</body>
</html>
